name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.8.3"
  ANDROID_NDK_VERSION: "26.1.10909125"   # the NDK Qt 6.8 is tested with

jobs:
  linux:
    name: Linux (build, test, AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libegl1 file \
            libpulse0 libva2 libva-drm2 libva-x11-2 libvdpau1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Smoke test (launch the app on fixture data and take a screenshot)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QUOKKA_FIXTURES: ${{ github.workspace }}/tests/fixtures
          QUOKKA_WINDOW_SIZE: 412x900
          QUOKKA_SCREENSHOT: ${{ github.workspace }}/screenshot-linux.png:4000
        run: |
          ./build/quokka
          test -s screenshot-linux.png
          QUOKKA_SCREENSHOT="$GITHUB_WORKSPACE/screenshot-linux-post.png:4000" ./build/quokka /r/test/comments/abc/
          test -s screenshot-linux-post.png

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux
          path: screenshot-linux*.png

      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          EXTRA_PLUGINS: multimedia
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          DESTDIR=AppDir cmake --install build --prefix /usr
          export VERSION="${GITHUB_REF_NAME//\//-}"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/io.github.sadikbr.quokka.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/quokka.png \
            --plugin qt --output appimage
          mv Quokka-*.AppImage Quokka-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: quokka-linux-appimage
          path: Quokka-x86_64.AppImage

  android:
    name: Android (arm64 APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Qt (desktop host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          set-env: false
          dir: ${{ runner.temp }}/qt-host

      - name: Install Qt (Android)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os          # Qt >= 6.7 publishes Android packages under "all_os"
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          cache: true
          dir: ${{ runner.temp }}/qt-android

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${ANDROID_NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="${{ runner.temp }}/qt-host/Qt/${QT_VERSION}/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" \
            -DQUOKKA_BUILD_TESTS=OFF

      - name: Build APK
        run: cmake --build build --target apk

      # Signs with the release key from repository secrets when present (so updates install over
      # older versions); otherwise with a throwaway key so the APK is still installable.
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APK=$(find build/android-build -name "*-unsigned.apk" | head -n1)
          [ -z "$APK" ] && APK=$(find build/android-build -name "*.apk" | head -n1)
          echo "Built: $APK"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with a throwaway key."
            KEYSTORE_PASSWORD=throwaway; KEY_ALIAS=quokka
            keytool -genkeypair -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Quokka CI"
          fi
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --out Quokka-arm64-v8a.apk aligned.apk
          "$BT/apksigner" verify Quokka-arm64-v8a.apk
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: quokka-android-apk
          path: Quokka-arm64-v8a.apk

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Quokka-x86_64.AppImage
            dist/Quokka-arm64-v8a.apk
